[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uq_oma_b"
version = "0.1.0a1"
description = "Weighted/statistic-level OMA uncertainty case studies for PolyUQ (successor of oma_uq / uq_oma_a)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Simon Marwitz", email = "25247720+simonmarwitz@users.noreply.github.com" },
    { name = "Volkmar Zabel" },
]
keywords = [
    "uncertainty quantification", "operational modal analysis",
    "structural health monitoring", "guyed mast", "wind engineering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.9"
dependencies = [
    "polyuq",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
fem = [
    # ANSYS PyMAPDL or equivalent for FEM mapping (stage 1)
    # install manually; not on PyPI
]
hpc = [
    "ray",
    "scikit-learn",    # OPTICS clustering in cluster_modes
    "simpleflock",
    "psutil",
]
dev = [
    "pytest>=7",
    "pytest-cov",
    "nbstripout",
]

[project.urls]
Predecessor = "https://github.com/simonmarwitz/oma_uq"
"PolyUQ engine" = "https://github.com/simonmarwitz/PolyUQ"
"Supplemental Data" = "https://doi.org/10.71758/refodat.46"

[tool.setuptools.packages.find]
where = ["."]
include = ["model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "hpc: requires ray/cluster environment",
    "fem: requires ANSYS",
    "data: requires POLYUQ_DATA_DIR",
    "slow: long-running (minutes)",
]
filterwarnings = ["ignore::DeprecationWarning"]
